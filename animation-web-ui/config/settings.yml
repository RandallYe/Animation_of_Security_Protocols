# Values formatted like "_env:YESOD_ENV_VAR_NAME:default_value" can be overridden by the specified environment variable.
# See https://github.com/yesodweb/yesod/wiki/Configuration#overriding-configuration-values-with-environment-variables

static-dir:     "_env:YESOD_STATIC_DIR:static"
host:           "_env:YESOD_HOST:*4" # any IPv4 host
port:           "_env:YESOD_PORT:3000" # NB: The port `yesod devel` uses is distinct from this value. Set the `yesod devel` port from the command line.
# For `keter` user, enable the follwing line, and comment out previous one.
#port:           "_env:PORT:3000" # `keter` uses `PORT` env var name

ip-from-header: "_env:YESOD_IP_FROM_HEADER:false"

# Default behavior: determine the application root from the request headers.
# Uncomment to set an explicit approot
#approot:        "_env:YESOD_APPROOT:http://localhost:3000"

# By default, `yesod devel` runs in development, and built executables use
# production settings (see below). To override this, use the following:
#
# development: false

# Optional values with the following production defaults.
# In development, they default to the inverse.
#
# detailed-logging: false
# should-log-all: false
# reload-templates: false
# mutable-static: false
# skip-combining: false
# auth-dummy-login : false

# NB: If you need a numeric value (e.g. 123) to parse as a String, wrap it in single quotes (e.g. "_env:YESOD_PGPASS:'123'")
# See https://github.com/yesodweb/yesod/wiki/Configuration#parsing-numeric-values-as-strings

database:
  # See config/test-settings.yml for an override during tests
  database: "_env:YESOD_SQLITE_DATABASE:animation-web-ui.sqlite3"
  poolsize: "_env:YESOD_SQLITE_POOLSIZE:10"

copyright: 2024 Kangfeng Ye 
#analytics: UA-YOURCODE

plantuml-url: http://localhost:8080/plantuml/svg

# The maximum depth of an event tree to be explored and stored in DB, and the
# number of internal steps the exploration may take between visible events.
# These two are the fallback defaults; each protocol normally overrides them
# under event-tree-bounds below.
#
# All four protocols are explored with the same bounds, 15 visible events and an
# internal-step budget of 100 between consecutive visible events.  The cost is
# driven by how many traces the model has, and the models differ by orders of
# magnitude; measured single explorations (GHC 9.2.8, -O0) at these depths are
# recorded in REGEN_ANIMATORS.md.  If a smaller mx cuts the exploration short,
# the interface warns and asks for a larger value instead of silently reporting
# a partial result.
#
# NOTE: for all four models the internal-step bound made no difference at these
# depths (mx = 3 and mx = 100 give identical trace sets); it is the depth that
# costs.  It still matters for completeness -- mx = 0 collapses the exploration.
event-tree-depth: 15
event-tree-internal-depth: 100

# Build the event trees of all protocols in the background at startup, so that
# the first visit to a page does not have to wait for its exploration.  A page
# that still finds an empty table waits for the same build (serialised by a
# per-protocol lock) instead of building a second tree.
event-tree-preload: true

# Per-protocol overrides: protocol -> [depth, internal-depth]
event-tree-bounds:
  nspk3: [15, 100]
  nslpk3: [15, 100]
  nswj3: [15, 100]
  dhwj: [15, 100]
